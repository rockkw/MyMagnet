# /etc/nginx/sites-available/magnetlookup — reverse proxy to webserver.py
#
# Install:
#   sudo cp nginx-magnetlookup.conf /etc/nginx/sites-available/magnetlookup
#   sudo ln -s /etc/nginx/sites-available/magnetlookup /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then get TLS with Certbot (requires a DNS name pointed at the instance):
#   sudo certbot --nginx -d magnet.yourdomain.com
# Certbot rewrites this file in place to add the 443 server block + redirect.

server {
    listen 80;
    listen [::]:80;
    server_name magnet.yourdomain.com;   # <-- replace with your DNS name, or the instance's public IP for testing

    # Optional but recommended: this dashboard shows your search/download
    # history, so gate it behind HTTP basic auth even over TLS.
    #   sudo apt install apache2-utils
    #   sudo htpasswd -c /etc/nginx/magnetlookup.htpasswd yourusername
    # auth_basic           "magnetlookup";
    # auth_basic_user_file /etc/nginx/magnetlookup.htpasswd;

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    client_max_body_size 4m;
}
