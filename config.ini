# magnetlookup configuration
# All paths support environment variable expansion: ${VAR} or $VAR
# Override any value by setting the corresponding env var before running:
#
#   export MAGNET_SEARCH_FILE=/data/search_term.txt
#   export MAGNET_URLS_FILE=/data/urls.txt
#   export MAGNET_DB_FILE=/data/magnet_library.db
#   export MAGNET_LOG_DIR=/data/logs
#   export MAGNET_OUTPUT_DIR=/data/magnet_results
#   export MAGNET_PORT=8080

[paths]
search_file = ${MAGNET_SEARCH_FILE:-${HOME}/Library/Mobile Documents/com~apple~CloudDocs/Downloads/search_term.txt}
urls_file   = ${MAGNET_URLS_FILE:-${HOME}/Documents/Development/urls.txt}
db_file     = ${MAGNET_DB_FILE:-${HOME}/Documents/Development/magnet_library.db}
log_dir     = ${MAGNET_LOG_DIR:-${HOME}/Documents/Development/logs}
output_dir  = ${MAGNET_OUTPUT_DIR:-${HOME}/Documents/Development/magnet_results}

[server]
port = ${MAGNET_PORT:-8080}

[transmission]
host         = localhost:9091
default_dir  = ${HOME}/Movies
; Per-category download directories — category names are case-insensitive.
; Add or rename entries to match your search_term.txt [Category] headers.
Books        = ${HOME}/Downloads/Books
Movies       = ${HOME}/Downloads/Movies
Software     = ${HOME}/Downloads/Software
Music        = ${HOME}/Downloads/Music

[scraper]
js_render_timeout = ${MAGNET_JS_TIMEOUT:-10}
js_settle_pause   = ${MAGNET_JS_PAUSE:-2}
request_delay     = ${MAGNET_REQUEST_DELAY:-2}
